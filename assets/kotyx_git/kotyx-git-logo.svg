<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="kg-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C8DFF" />
      <stop offset="100%" stop-color="#A371F7" />
    </linearGradient>
    <linearGradient id="kg-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#4C8DFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0.5" />
    </linearGradient>
    <filter id="kg-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4C8DFF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Square Base (matches New-AppIcon.ps1 ratio 6/26) -->
  <rect x="14" y="14" width="228" height="228" rx="52" ry="52" fill="url(#kg-bg)" stroke="url(#kg-border)" stroke-width="3" filter="url(#kg-shadow)" />

  <!-- Subtle Git Graph Lines inside the icon background -->
  <g opacity="0.18" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 56 44 L 56 212" />
    <path d="M 56 92 C 56 118, 196 102, 196 134 L 196 204" />
    <circle cx="56" cy="70" r="8" fill="#FFFFFF" stroke="none" />
    <circle cx="56" cy="148" r="8" fill="#FFFFFF" stroke="none" />
    <circle cx="196" cy="148" r="8" fill="#FFFFFF" stroke="none" />
  </g>

  <!-- Bold White 'K' Monogram with Git Node Accent -->
  <path d="M 78 64 L 106 64 L 106 119 L 156 64 L 190 64 L 134 124 L 194 192 L 159 192 L 114 140 L 106 149 L 106 192 L 78 192 Z" fill="#FFFFFF" />
  <circle cx="176" cy="64" r="11" fill="#39C5CF" stroke="#0E1116" stroke-width="4" />
  <circle cx="176" cy="192" r="11" fill="#3FB950" stroke="#0E1116" stroke-width="4" />
</svg>

